                clothe-returns: true
                group-params: true
            extra-rules: false
            module-path: ""
        goimports:
            local-prefixes: []
        golines:
            chain-split-dots: false
            max-len: 0
            reformat-tags: false
            shorten-comments: false
            tab-len: 0
